<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Debate Agora</title>
    <meta name="description" content="Bring a question to a thoughtful group conversation.">
    <meta name="theme-color" content="#faf9f6">
    <base href="{{ base_href }}">
    <link rel="icon" href="{{ icon_url }}" sizes="192x192">
    <link rel="stylesheet" href="{{ shared_asset_base }}base.css">
    <link rel="stylesheet" href="{{ asset_base }}surface-tokens.css?v=glass-31">
    <link rel="stylesheet" href="{{ asset_base }}debate.css?v=mobile-compact-90">
    <link rel="stylesheet" href="{{ asset_base }}app-surfaces.css?v=glass-31">
    <link rel="stylesheet" href="{{ asset_base }}dialogs.css?v=mobile-compact-90">
    <link rel="stylesheet" href="{{ asset_base }}folders.css?v=mobile-compact-90">
  </head>
  <body class="shell-body debate-body">
    <a class="skip-link" href="{{ current_page }}#app-view">Skip to main content</a>
    <div class="debate-shell" id="app">
      <aside id="workspace-sidebar" class="workspace-sidebar" aria-label="Sidebar"></aside>
      <button class="drawer-dismiss" data-workspace="close-drawers" aria-label="Dismiss side panel" tabindex="-1"></button>
      <div class="workspace-body">
        <header id="stage-navigation" class="site-header"></header>
        <main id="app-view" class="app-content" tabindex="-1" aria-label="Debate"></main>
      </div>
    </div>
    <dialog id="workspace-dialog" class="workspace-dialog" aria-labelledby="workspace-dialog-title"></dialog>
    <div id="workspace-toast" class="workspace-toast" role="status" hidden></div>
    <dialog id="summary-dialog" class="summary-dialog polished-dialog" aria-labelledby="summary-dialog-title"></dialog>
    <div id="app-error" class="app-error" role="alert" aria-live="assertive" hidden></div>

    <script id="gizmoapp-config" type="application/json">{{ client_config | tojson }}</script>
    <script src="{{ shared_asset_base }}boot.js"></script>
    <script type="module" src="{{ asset_base }}debate.js?v=folder-motion-88"></script>
  </body>
</html>
